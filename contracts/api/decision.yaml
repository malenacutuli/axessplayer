openapi: 3.0.0
info: { title: Axessplayer Decision API, version: 0.3.1 }
# Latency budget: p99 < 50ms. On timeout or opt-out, return the director's cut.
paths:
  /decide:
    post:
      summary: Choose the next beat variant for a viewer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, current_beat_id, signals]
              properties:
                user_id: { type: string, format: uuid }
                current_beat_id: { type: string, format: uuid }
                signals:
                  type: object
                  properties:
                    completion: { type: number }
                    dwell_ms: { type: integer }
                    replays: { type: integer }
                    skipped: { type: boolean }
                    choice: { type: string }
      responses:
        '200':
          description: The chosen next variant, top-k prefetch hints, the control flag, and policy version.
          content:
            application/json:
              schema:
                type: object
                required: [decision_id, next_variant_id, is_control, policy_version]
                properties:
                  decision_id: { type: string, format: uuid }
                  next_variant_id: { type: string, format: uuid }
                  prefetch_variant_ids:
                    type: array
                    items: { type: string, format: uuid }     # n1: uuid format like every sibling id
                    description: "Top-k likely next variants. The player fetches each one's manifest to buffer for the seamless switch."
                  is_control: { type: boolean }
                  policy_version: { type: string }
