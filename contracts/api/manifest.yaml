openapi: 3.0.0
info: { title: Axessplayer Manifest API, version: 0.3.0 }
# PF-6 + M4: client-side branching, keyed purely on variant_id. No session_id (it was vestigial and undefined).
# /manifest is a pure function of one variant_id and returns one seamless playlist. The player calls it once per
# candidate (chosen + each prefetch hint) and switches client-side (W5 runtime).
paths:
  /manifest/{variant_id}.m3u8:
    get:
      summary: Return the seamless HLS playlist for a single variant.
      parameters:
        - { name: variant_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: HLS playlist, content: { application/vnd.apple.mpegurl: {} } }
