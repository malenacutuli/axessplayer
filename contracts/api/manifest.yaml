openapi: 3.0.0
info: { title: Axessplayer Manifest API, version: 0.2.0 }
# PF-6: client-side branching. /manifest is a pure function of ONE variant_id and returns one seamless playlist.
# The player calls it once per candidate (chosen + each prefetch hint) and switches client-side (W5 runtime).
# Branching and prefetch logic live in the player SDK, not here. There is no prefetch query param.
paths:
  /manifest/{session_id}.m3u8:
    get:
      summary: Return the seamless HLS playlist for a single variant.
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
        - { name: variant_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: HLS playlist, content: { application/vnd.apple.mpegurl: {} } }
