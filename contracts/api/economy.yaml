openapi: 3.0.0
info: { title: Axessplayer Economy API, version: 0.3.1 }
# Server-authoritative. Price derived from the catalog. Idempotent on (user_id, client_txn_id).
components:
  schemas:
    Error:
      type: object
      required: [error]
      properties: { error: { type: string } }
    Entitlement:
      type: object
      required: [scope, scope_id]
      properties: { scope: { type: string, enum: [episode, beat_variant] }, scope_id: { type: string, format: uuid } }
    Wallet:
      type: object
      required: [user_id, balance, bonus_balance, entitlements]
      properties: { user_id: { type: string, format: uuid }, balance: { type: integer }, bonus_balance: { type: integer }, entitlements: { type: array, items: { $ref: '#/components/schemas/Entitlement' } } }
    PaywallOptions:
      type: object
      required: [error, options]
      properties: { error: { type: string, example: insufficient_funds }, options: { type: array, items: { type: string, enum: [buy, watch_ad, subscribe] } } }
paths:
  /wallet/{user_id}:
    get:
      operationId: getWallet
      summary: Get balance and entitlements.
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Current balance and entitlements for the user.
          content: { application/json: { schema: { $ref: '#/components/schemas/Wallet' } } }
        '404':
          description: No wallet exists for that user.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /spend:
    post:
      operationId: spend
      summary: Unlock an episode or premium variant. Idempotent. Price server-derived.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [user_id, scope, scope_id, client_txn_id], properties: { user_id: { type: string, format: uuid }, scope: { type: string, enum: [episode, beat_variant] }, scope_id: { type: string, format: uuid }, client_txn_id: { type: string } } } } }
      responses:
        '200':
          description: new balance and entitlement granted
          content: { application/json: { schema: { type: object, required: [balance, entitlement], properties: { balance: { type: integer }, entitlement: { $ref: '#/components/schemas/Entitlement' } } } } }
        '402':
          description: insufficient funds
          content: { application/json: { schema: { $ref: '#/components/schemas/PaywallOptions' } } }
  /grant:
    post:
      operationId: grant
      summary: Grant coins (IAP, rewarded ad, checkin). Idempotent on (user_id, client_txn_id).
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [user_id, amount, type, client_txn_id], properties: { user_id: { type: string, format: uuid }, amount: { type: integer }, type: { type: string, enum: [iap, rewarded_ad, offer_wall, checkin, refund] }, client_txn_id: { type: string } } } } }
      responses:
        '200':
          description: The new balance after the grant.
          content: { application/json: { schema: { type: object, required: [balance], properties: { balance: { type: integer } } } } }
        '409':
          description: Invalid or conflicting grant (for example an unknown grant type).
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
