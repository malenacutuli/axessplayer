openapi: 3.0.0
info: { title: Axessplayer Content API, version: 0.3.1 }
components:
  schemas:
    Error:
      type: object
      required: [error]
      properties: { error: { type: string } }
paths:
  /series/{id}/graph:
    get:
      operationId: getSeriesGraph
      summary: "Resolve a series into a playable graph (episodes, beats, variants, edges)."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: graph }
        '404': { description: "No series with that id.", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /series:
    post:
      operationId: createSeries
      summary: "Create a series."
      responses:
        '201': { description: created }
        '400': { description: "Invalid series payload.", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /episodes:
    post:
      operationId: createEpisode
      summary: "Create an episode (episode_number, coin_cost, is_free)."
      responses:
        '201': { description: created }
        '400': { description: "Invalid episode payload.", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /beats:
    post:
      operationId: createBeat
      summary: "Create a beat under an episode."
      responses:
        '201': { description: created }
        '400': { description: "Invalid beat payload.", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /variants:
    post:
      operationId: createVariant
      summary: "Attach a variant to a beat (language, accessibility, intensity, tier, is_premium, coin_cost)."
      responses:
        '201': { description: created }
        '400': { description: "Invalid variant payload.", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /edges:
    post:
      operationId: createEdge
      summary: "Connect two beats with a condition."
      responses:
        '201': { description: created }
        '400': { description: "Invalid edge payload.", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
