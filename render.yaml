# Render Blueprint for the Axessplayer backend (Node services on Docker, bound to the hosted Supabase mobile
# schema). The frontends (viewer, studio, admin, gallery) are on Vercel, not Render. After a Blueprint sync,
# set ONE secret in the dashboard: the axessplayer-shared env group's DATABASE_URL (the Supabase SESSION
# pooler string), plus the per-service sync:false secrets on the 5 original services. Server secrets never
# ship to a browser. No em dashes.

envVarGroups:
  # Shared by the newer services (all read the hosted mobile schema with the same pooler + staging verifier).
  # Set DATABASE_URL once here and every linked service inherits it.
  - name: axessplayer-shared
    envVars:
      # staging, NOT production: the newer services hard-stop under NODE_ENV=production (the real JWKS verifier
      # is a flagged cutover gate); staging uses the session-token verifier the apps send. QA-grade auth.
      - key: NODE_ENV
        value: staging
      - key: DB_OPTIONS
        value: "-c search_path=mobile,public"
      - key: SUPABASE_URL
        value: https://faeyekynudyzeotbjfsj.supabase.co
      - key: DATABASE_URL
        sync: false

services:
  # ================= original 5 services (unchanged, already live) =================
  - type: web
    name: axessplayer-content
    runtime: docker
    dockerfilePath: ./services/content/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    envVars:
      # Cloudflare Stream (creator uploads + signed playback). Values from scripts/stream-setup.mjs.
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_STREAM_API_TOKEN
        sync: false
      - key: STREAM_WEBHOOK_SECRET
        sync: false
      - key: STREAM_SIGNING_KEY_ID
        sync: false
      - key: STREAM_SIGNING_KEY_PEM
        sync: false
      # Creator auth (session verification + series ownership) and the service secret for /admin routes.
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CONTENT_SERVICE_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: DB_OPTIONS
        value: "-c search_path=mobile,public"
      - key: SUPABASE_URL
        value: https://faeyekynudyzeotbjfsj.supabase.co
      - key: POSTER_BUCKET
        value: thumbnails
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  - type: web
    name: axessplayer-decision
    runtime: docker
    dockerfilePath: ./services/decision/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    envVars:
      # Real session verification (packages/session-auth). Public values: the project URL and anon key.
      - key: SUPABASE_URL
        value: https://faeyekynudyzeotbjfsj.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: NODE_ENV
        value: staging
      - key: DB_OPTIONS
        value: "-c search_path=mobile,public"
      - key: DATABASE_URL
        sync: false

  - type: web
    name: axessplayer-economy
    runtime: docker
    dockerfilePath: ./services/economy/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    envVars:
      # Real session verification (packages/session-auth). Public values: the project URL and anon key.
      - key: SUPABASE_URL
        value: https://faeyekynudyzeotbjfsj.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: NODE_ENV
        value: staging
      - key: DB_OPTIONS
        value: "-c search_path=mobile,public"
      - key: DATABASE_URL
        sync: false
      - key: ECONOMY_SERVICE_SECRET
        sync: false

  - type: web
    name: axessplayer-manifest
    runtime: docker
    dockerfilePath: ./services/manifest/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_OPTIONS
        value: "-c search_path=mobile,public"
      - key: DATABASE_URL
        sync: false

  - type: web
    name: axessplayer-settlement
    runtime: docker
    dockerfilePath: ./services/monetization/Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    envVars:
      # Same value as the content service's CONTENT_SERVICE_SECRET (settlement calls content /admin routes).
      - key: CONTENT_SERVICE_SECRET
        sync: false
      # Session -> profile mapping for the reward routes (same database as economy).
      - key: DATABASE_URL
        sync: false
      # Real session verification (packages/session-auth). Public values: the project URL and anon key.
      - key: SUPABASE_URL
        value: https://faeyekynudyzeotbjfsj.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: ECONOMY_SERVICE_SECRET
        sync: false
      - key: ECONOMY_BASE_URL
        fromService:
          type: web
          name: axessplayer-economy
          property: hostport
      - key: CONTENT_BASE_URL
        fromService:
          type: web
          name: axessplayer-content
          property: hostport

  # ================= new services (QA wiring; share the axessplayer-shared env group) =================
  - type: web
    name: axessplayer-identity
    runtime: docker
    dockerfilePath: ./services/identity/Dockerfile
