name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:validate
      - run: pnpm gen
      - run: pnpm typecheck
      - run: pnpm lint
      # Serialize turbo test tasks: 3+ PGlite (wasm Postgres) + tsx suites running at once
      # saturate CPU and intermittently crash node:test ("Promise resolution is still pending").
      # Node 20 is already pinned above; the concurrency cap is the deterministic fix.
      - run: pnpm exec turbo run test --concurrency=1

  # The two ledger suites need a real multi-connection Postgres (FOR UPDATE contention), so they run
  # against a service container, not the in-process PGlite used by the fast `pnpm test`. Each suite gets
  # its OWN postgres service so it applies migrations to a fresh database (the harnesses CREATE TABLE
  # without IF NOT EXISTS, so they cannot share one database across steps). postgres:15 matches prod
  # Supabase; local runs use embedded-postgres, but CI pins the production major.
  ledger-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: pw
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @axessplayer/economy test:concurrency
        env:
          DATABASE_URL: postgres://postgres:pw@localhost:5432/postgres

  ledger-hardening:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: pw
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @axessplayer/economy test:hardening
        env:
          DATABASE_URL: postgres://postgres:pw@localhost:5432/postgres

  # W12 end-to-end acceptance gate. Stands up the four real HTTP services on ephemeral localhost ports and
  # drives the adaptive-cinema flow over the network against a real Postgres with migrations 0001..0005 +
  # seed applied to a fresh database. Like the ledger suites it gets its OWN postgres:15 service (so it
  # applies the schema to a clean database, and matches prod Supabase's major). It needs the generated
  # contract types the services import, so `pnpm gen` runs before the suite. DATABASE_URL points the
  # harness at the service container instead of the local embedded-postgres used for local runs.
  e2e-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: pw
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen
      - run: pnpm --filter @axessplayer/e2e-acceptance test
        env:
          DATABASE_URL: postgres://postgres:pw@localhost:5432/postgres
